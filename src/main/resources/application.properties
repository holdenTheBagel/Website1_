spring.application.name=portfolio
server.port=${PORT:8080}

# --- Database (H2, file-based so data survives restarts) ---
spring.datasource.url=jdbc:h2:file:./data/portfolio;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 web console — disabled by default (would otherwise expose an unauthenticated DB
# admin UI publicly once deployed). Re-enabled for local dev only, in application-local.properties.
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# --- Mail (Gmail SMTP; username + password are set in application-local.properties,
#     which is gitignored and never committed. Password must be a Gmail App Password,
#     never your real Google account password.) ---
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# Fail fast instead of hanging the request thread if the mail server is slow/unreachable
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Where contact notifications are sent (defaults to the mailbox above if unset)
contact.notify-to=${CONTACT_NOTIFY_TO:holdencase@outlook.com}
