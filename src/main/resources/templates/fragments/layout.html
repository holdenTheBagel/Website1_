    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
        <style>
            .bg { fill: #000000; }

            /* No filter (blur glow) on any tentacle: a blur filter forces a full
               re-rasterization every single frame its source geometry changes, and
               these paths animate their "d" attribute via SMIL - measured empirically
               to cut frame rate from 60fps to ~15fps with filter+animate combined.
               Node glow is unaffected (nodes only animate transform/opacity, which the
               compositor can do cheaply against a cached filter raster). */
            .tentacle {
                fill: none;
                stroke: #ffffff;
                stroke-linecap: round;
            }

            .tentacle-main {
                stroke-width: 3.2;
                stroke-opacity: 0.75;
            }

            .tentacle-branch {
                stroke-width: 2;
                stroke-opacity: 0.55;
            }

            .tentacle-mesh {
                stroke-width: 1.3;
                stroke-opacity: 0.32;
            }

            .node {
                fill: url(#nodeGradient);
                transform-box: fill-box;
                transform-origin: center;
                animation-name: pulse;
                animation-timing-function: ease-in-out;
                animation-iteration-count: infinite;
                filter: url(#glow);
            }

            .node-hub { opacity: 0.9; }
            .node-mesh { opacity: 0.55; filter: none; }
            .node-foreground {
                opacity: 1;
                filter: url(#glow-strong);
            }
            .node-dust {
                opacity: 0.4;
                filter: none;
                animation-name: twinkle;
                animation-timing-function: ease-in-out;
                animation-iteration-count: infinite;
            }

            @keyframes pulse {
                0%, 100% { opacity: 0.6; transform: scale(1); }
                50% { opacity: 1; transform: scale(1.35); }
            }
            @keyframes twinkle {
                0%, 100% { opacity: 0.15; }
                50% { opacity: 0.65; }
            }
        </style>

        <defs>
            <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
                <feGaussianBlur stdDeviation="4" result="blur"/>
                <feMerge>
                    <feMergeNode in="blur"/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>
            <filter id="glow-strong" x="-100%" y="-100%" width="300%" height="300%">
                <feGaussianBlur stdDeviation="7" result="blur"/>
                <feMerge>
                    <feMergeNode in="blur"/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>
            <radialGradient id="nodeGradient" cx="35%" cy="32%" r="68%">
                <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
                <stop offset="55%" stop-color="#e6efff" stop-opacity="0.85"/>
                <stop offset="100%" stop-color="#8fb2ff" stop-opacity="0.2"/>
            </radialGradient>
        </defs>
