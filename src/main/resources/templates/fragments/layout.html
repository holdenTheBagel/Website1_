            .bg { fill: #000000; }
            .tint { fill: #003399; fill-opacity: 0.25; }

            .tentacle {
                fill: none;
                stroke: #ffffff;
                stroke-linecap: round;
                filter: url(#glow);
            }

            .tentacle-main {
                stroke-width: 3.5;
                stroke-opacity: 0.65;
            }

            .tentacle-branch {
                stroke-width: 2.2;
                stroke-opacity: 0.5;
            }

            .tentacle-mesh {
                stroke-width: 1.8;
                stroke-opacity: 0.4;
            }

            .node {
                fill: url(#nodeGradient);
                transform-box: fill-box;
                transform-origin: center;
                animation-name: pulse;
                animation-timing-function: ease-in-out;
                animation-iteration-count: infinite;
                filter: url(#glow);
            }

            .node-hub { opacity: 0.95; }
            .node-tip { opacity: 0.7; }
            .node-mesh { opacity: 0.6; }
            .node-ambient { opacity: 0.45; }
            .node-foreground {
                opacity: 1;
                filter: url(#glow-strong);
            }

            @keyframes pulse {
                0%, 100% { opacity: 0.6; transform: scale(1); }
                50% { opacity: 1; transform: scale(1.35); }
            }
        </style>

                <feMerge>

                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>
            <filter id="glow-strong" x="-100%" y="-100%" width="300%" height="300%">

                    <feMergeNode in="blur"/>
                    <feMergeNode in="SourceGraphic"/>

                <stop offset="55%" stop-color="#e6efff" stop-opacity="0.85"/>
                <stop offset="100%" stop-color="#8fb2ff" stop-opacity="0.2"/>
