<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Contact')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container py-5">
    <div class="panel">
    <h1 class="mb-3">Contact Me</h1>
    <p class="text-muted">Have a project in mind or a question? Send a message below and I'll get back to you.</p>

    <div class="alert alert-success" role="alert" th:if="${success}">
        Thanks for reaching out! I'll get back to you soon.
    </div>
    <div class="alert alert-warning" role="alert" th:if="${rateLimited}">
        You're submitting a bit too quickly — please wait a moment and try again.
    </div>

    <form th:action="@{/contact}" th:object="${contactForm}" method="post" class="row g-3" style="max-width: 640px;">

        <div class="col-12">
            <label class="form-label" for="name">Name</label>
            <input type="text" class="form-control" id="name" th:field="*{name}"
                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="col-12">
            <label class="form-label" for="email">Email</label>
            <input type="email" class="form-control" id="email" th:field="*{email}"
                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <div class="col-12">
            <label class="form-label" for="subject">Subject</label>
            <input type="text" class="form-control" id="subject" th:field="*{subject}"
                   th:classappend="${#fields.hasErrors('subject')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('subject')}" th:errors="*{subject}"></div>
        </div>

        <div class="col-12">
            <label class="form-label" for="message">Message</label>
            <textarea class="form-control" id="message" rows="5" th:field="*{message}"
                      th:classappend="${#fields.hasErrors('message')} ? 'is-invalid'"></textarea>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('message')}" th:errors="*{message}"></div>
        </div>

        <!-- Honeypot: hidden off-screen via CSS, left blank by real visitors -->
        <div class="honeypot-field" aria-hidden="true">
            <label for="website">Website</label>
            <input type="text" id="website" th:field="*{website}" tabindex="-1" autocomplete="off">
        </div>

        <div class="col-12">
            <button type="submit" class="btn btn-primary">Send Message</button>
        </div>
    </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
