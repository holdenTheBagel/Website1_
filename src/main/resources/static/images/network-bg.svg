<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
    <rect x="0" y="0" width="1600" height="900" fill="#012a66"/>

    <g stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5">
        <!-- horizontal chains -->
        <line x1="100" y1="150" x2="380" y2="150"/>
        <line x1="380" y1="150" x2="660" y2="150"/>
        <line x1="660" y1="150" x2="940" y2="150"/>
        <line x1="940" y1="150" x2="1220" y2="150"/>
        <line x1="1220" y1="150" x2="1500" y2="150"/>

        <line x1="100" y1="450" x2="380" y2="450"/>
        <line x1="380" y1="450" x2="660" y2="450"/>
        <line x1="660" y1="450" x2="940" y2="450"/>
        <line x1="940" y1="450" x2="1220" y2="450"/>
        <line x1="1220" y1="450" x2="1500" y2="450"/>

        <line x1="100" y1="750" x2="380" y2="750"/>
        <line x1="380" y1="750" x2="660" y2="750"/>
        <line x1="660" y1="750" x2="940" y2="750"/>
        <line x1="940" y1="750" x2="1220" y2="750"/>
        <line x1="1220" y1="750" x2="1500" y2="750"/>

        <!-- vertical links -->
        <line x1="100" y1="150" x2="100" y2="450"/>
        <line x1="380" y1="150" x2="380" y2="450"/>
        <line x1="660" y1="150" x2="660" y2="450"/>
        <line x1="940" y1="150" x2="940" y2="450"/>
        <line x1="1220" y1="150" x2="1220" y2="450"/>
        <line x1="1500" y1="150" x2="1500" y2="450"/>

        <line x1="100" y1="450" x2="100" y2="750"/>
        <line x1="380" y1="450" x2="380" y2="750"/>
        <line x1="660" y1="450" x2="660" y2="750"/>
        <line x1="940" y1="450" x2="940" y2="750"/>
        <line x1="1220" y1="450" x2="1220" y2="750"/>
        <line x1="1500" y1="450" x2="1500" y2="750"/>

        <!-- diagonal cross-links for an organic neural-net feel -->
        <line x1="380" y1="150" x2="660" y2="450"/>
        <line x1="940" y1="150" x2="660" y2="450"/>
        <line x1="660" y1="450" x2="940" y2="750"/>
        <line x1="1220" y1="450" x2="940" y2="750"/>
        <line x1="100" y1="150" x2="380" y2="450"/>
        <line x1="1220" y1="150" x2="1500" y2="450"/>
    </g>

    <g fill="#ffffff" fill-opacity="0.55">
        <circle cx="100" cy="150" r="4"/>
        <circle cx="380" cy="150" r="3"/>
        <circle cx="660" cy="150" r="5"/>
        <circle cx="940" cy="150" r="3"/>
        <circle cx="1220" cy="150" r="4"/>
        <circle cx="1500" cy="150" r="3"/>

        <circle cx="100" cy="450" r="3"/>
        <circle cx="380" cy="450" r="5"/>
        <circle cx="660" cy="450" r="6"/>
        <circle cx="940" cy="450" r="4"/>
        <circle cx="1220" cy="450" r="3"/>
        <circle cx="1500" cy="450" r="5"/>

        <circle cx="100" cy="750" r="4"/>
        <circle cx="380" cy="750" r="3"/>
        <circle cx="660" cy="750" r="5"/>
        <circle cx="940" cy="750" r="3"/>
        <circle cx="1220" cy="750" r="4"/>
        <circle cx="1500" cy="750" r="3"/>
    </g>
</svg>
